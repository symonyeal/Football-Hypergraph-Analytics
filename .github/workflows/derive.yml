name: derive
# Streams StatsBomb open data at the pinned commit, runs the registered tests and commits aggregate results only.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "attack, defence, sequence, lineup, seasons or wyscout"
        required: true
      limit:
        description: "smoke test: matches per competition end (empty = full run)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release
      - run: pip install -r requirements.txt
      - if: inputs.stage == 'sequence'
        run: pip install "socceraction==1.5.3" "multimethod<2"
      - run: python -m fha.run ${{ inputs.stage }} ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
      - if: inputs.limit == ''
        run: python -m fha.report
      - if: inputs.limit == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "results: ${{ inputs.stage }} from hudl/open-data 4b73468" || echo "no change"
          git pull --rebase
          git push
